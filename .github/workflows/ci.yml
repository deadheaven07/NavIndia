name: Production CI & Latency SLA Regression Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Typecheck & Latency SLA Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies (Deterministic npm ci)
        run: npm ci

      - name: TypeScript Type-Check & Production Build
        run: npm run build

      - name: Vitest Latency SLA & Spatial Performance Benchmarks
        run: npm test
